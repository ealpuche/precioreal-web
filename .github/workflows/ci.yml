name: CI
on:
  push:
    branches: [main]
  pull_request:

# Mínimo necesario: leer el código. SonarCloud usa su propio token y decora el PR con su app.
permissions:
  contents: read

jobs:
  # Falla si el PR agrega una dependencia, o cambia la versión de una, y la versión que queda
  # tiene una vulnerabilidad alta o crítica conocida (GitHub Advisory Database), aunque esa
  # vulnerabilidad ya existiera en main. Un paquete que el PR no toca no cuenta. Las
  # existentes las corrige Dependabot (#43); si una heredada bloquea un PR legítimo antes de
  # cerrar #5, se puede excluir temporalmente con `allow-ghsas`. Solo tiene sentido en PRs.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Check requerido en main (#43): falla con tests en rojo, cobertura de líneas < 90 %
  # (vitest.config.ts), build roto, 404 sin prerenderizar o quality gate de SonarCloud en
  # rojo (sonar.qualitygate.wait=true en sonar-project.properties).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud calcula "new code" contra el historial; con el shallow clone
          # por defecto marcaría todo el repo como nuevo y el gate reprobaría (#6).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      # El lcov que Sonar lee sale de aquí. Sin este paso el análisis reporta 0% de
      # coverage y el gate evalúa sobre datos vacíos (#6).
      - run: npm run test:coverage
      # astro check no ejercita el renderizado de páginas ni el adaptador de Cloudflare: una
      # regresión de build solo aparecía en el deploy (CR #4, Copilot).
      - run: npm run build
      # #20: si 404.astro deja de prerenderizarse, `dist/404.html` desaparece y el
      # handler de assets de Pages vuelve al fallback SPA: 200 con la landing en toda
      # ruta sin match. Ningún test de vitest lo detecta —el mecanismo vive en el
      # runtime de Pages, no en el repo—, pero la ausencia del archivo sí.
      - run: test -f dist/404.html
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
