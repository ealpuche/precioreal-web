name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      # astro check no ejercita el renderizado de páginas ni el adaptador de Cloudflare: una
      # regresión de build solo aparecía en el deploy (CR #4, Copilot).
      - run: npm run build
