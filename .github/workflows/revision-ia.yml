# Revisión automática de PRs con Claude.
# Workflow reutilizable: https://github.com/ealpuche/ai-code-review-workflows
# Política de revisión de este repo: .github/claude-review.md (se lee desde main).
#
# Corre al abrir, reabrir o marcar listo un PR hacia main; NO en cada push.
# Para re-revisar tras cambios: cerrar y reabrir el PR.
name: Revisión con IA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]

# El workflow reutilizable no puede pedir más permisos que los que da quien
# lo llama, así que se conceden aquí.
permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  claude:
    # Evita que corra en copias del repositorio donde no existe el secreto, y cuando quien
    # dispara el evento es Dependabot: no recibe el secreto (el job fallaría) y cada corrida
    # consume cuota (#43). Se usa `github.actor` y no el autor del PR a propósito: si el
    # mantenedor cierra y reabre un PR de Dependabot, la revisión corre con secretos. Es el
    # mismo mecanismo de re-revisión del resto de los PRs (revisión del PR #44).
    if: github.repository_owner == 'ealpuche' && github.actor != 'dependabot[bot]'
    uses: ealpuche/ai-code-review-workflows/.github/workflows/claude-pr-review.yml@v1
    # Sin bloque `with`, se usan los valores por defecto del workflow central
    # (modelo y turnos). Agrégalo solo si este repo necesita otros.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
