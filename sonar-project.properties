sonar.projectKey=ealpuche_precioreal-web
sonar.organization=ealpuche
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/*.astro,dist/**,.astro/**
# Mismo alcance que el `include` de vitest.config.ts: si un archivo no puede tener
# entrada en `coverage/lcov.info`, tampoco debe estar en el denominador del gate.
# `src/scripts/` es pegamento DOM sin tests (ADR-001 lo exige para los listeners) y
# `.d.ts` son declaraciones. Sin esta línea el gate mide sobre un denominador mayor
# que el umbral local de vitest, y cada archivo nuevo de `scripts/` alejaría las dos
# cifras: la cuarta señal contradiría a la tercera (CR PR #23, H1).
sonar.coverage.exclusions=src/scripts/**,**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
